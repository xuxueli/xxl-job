mybatis.mapper-locations=classpath:/mapper/**/*Mapper.xml
spring.datasource.url=jdbc:h2:mem:xxl_job;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../doc/db/tables_xxl_job.sql
spring.sql.init.continue-on-error=true
spring.mail.host=localhost
spring.mail.from=test@example.com
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
xxl.job.timeout=3
xxl.job.i18n=zh_CN
xxl.job.triggerpool.fast.max=300
xxl.job.triggerpool.slow.max=200
xxl.job.schedule.batchsize=100
xxl.job.logretentiondays=30
xxl-sso.token.key=xxl_job_login_token
xxl-sso.token.timeout=604800000
xxl-sso.client.excluded.paths=
xxl-sso.client.login.path=/auth/login
